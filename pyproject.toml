[project]
name = "parcelpilot-ai"
version = "0.1.0"
description = "ParcelPilot AI support system — CalQuity AI Engineer assessment submission"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: tests that call a live LLM API and are skipped when no API key is configured",
]
